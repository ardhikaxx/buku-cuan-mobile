name: buku_cuan_app
description: "Buku Cuan - Pencatatan Keuangan UMKM Sederhana"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.8.1

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8

  # Firebase
  firebase_core: ^3.13.1
  cloud_firestore: ^5.6.9

  # State Management
  provider: ^6.1.2

  # Local Storage
  shared_preferences: ^2.3.4

  # PDF Generation
  pdf: ^3.11.3
  printing: ^5.13.4

  # Excel Generation
  excel: ^4.0.6

  # Charts
  fl_chart: ^0.70.2

  # Notifications
  flutter_local_notifications: ^18.0.1
  timezone: ^0.10.0

  # Utils
  intl: ^0.19.0
  uuid: ^4.5.1
  crypto: ^3.0.6
  connectivity_plus: ^6.1.3
  path_provider: ^2.1.5
  share_plus: ^10.1.4

  # HTTP for validation
  http: ^1.3.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
